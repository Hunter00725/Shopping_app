
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shopping-v2
  template:
    metadata:
      labels:
        app: shopping-v2
    spec:
      containers:
        - name: shopping-app
          image: amalan4321/shopping-app:v2
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: shopping-v2-service
spec:
  type: ClusterIP
  selector:
    app: shopping-v2
  ports:
    - port: 5000
      targetPort: 5000
